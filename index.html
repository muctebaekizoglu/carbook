<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#fafaf9">
  <meta name="description" content="Carbook — vehicle expenses, value, and profit.">
  <title>Carbook</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script src="./vendor/supabase.js" defer></script>
  <script src="./config.js" defer></script>
  <script src="./finance.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="header"><a class="brand" href="./">carbook</a><button id="logout" hidden>Log out</button></header>
    <p id="status" role="status" aria-live="polite"></p>
    <button id="retry" hidden>Retry</button>
    <section id="auth" class="auth" hidden>
      <h1 id="auth-title">Log in</h1>
      <form id="auth-form">
        <div id="email-field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required maxlength="254"></div>
        <div id="password-field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128"></div>
        <button class="primary" id="auth-submit" type="submit">Log in</button>
      </form>
      <div class="auth-links"><button id="auth-toggle">Create account</button><button id="forgot">Reset password</button></div>
    </section>
    <main id="ledger" hidden>
      <div id="import-prompt" class="import-prompt" hidden><p>Vehicle records were found on this browser. Import them into this account?</p><button id="import-local">Import records</button><button id="dismiss-import">Later</button></div>
      <div class="toolbar"><label class="sr-only" for="vehicle-select">Vehicle</label><select id="vehicle-select"></select><button id="add-vehicle">Add vehicle</button></div>
      <section id="empty-state" hidden><h1>No vehicles yet</h1><p>Add a vehicle to start recording expenses.</p></section>
      <section id="vehicle-view" hidden>
        <div class="page-head"><div><h1 id="vehicle-title"></h1><p id="vehicle-vin" class="vin"></p></div><button id="edit-vehicle">Edit vehicle</button></div>
        <div class="details-grid">
          <section aria-labelledby="expenses-heading">
            <h2 id="expenses-heading">Expenses</h2>
            <div class="expense-head"><span>Description</span><span>Amount</span><span></span></div>
            <div id="expense-list"></div>
            <form id="add-expense-form" class="expense-line">
              <input id="expense-description" aria-label="New expense description" placeholder="Description" maxlength="100" required>
              <input id="expense-amount" aria-label="New expense amount" placeholder="Amount" type="number" inputmode="decimal" step="0.01" min="0" max="100000000" required>
              <button type="submit">Add</button>
            </form>
            <div class="total"><span>Total invested</span><strong id="expense-total"></strong></div>
          </section>
          <section class="valuation" aria-labelledby="value-heading">
            <h2 id="value-heading">Value & sale</h2>
            <form id="value-form">
              <label for="estimated-value">Estimated value</label><input id="estimated-value" type="number" inputmode="decimal" step="0.01" min="0" max="100000000" placeholder="Not entered">
              <p id="value-source" class="caption"></p>
              <a href="https://www.carfax.com/value/" target="_blank" rel="noopener noreferrer" id="check-carfax">CARFAX lookup · ZIP 73013</a>
              <label for="sold-price" class="sale-label">Sold price <span class="muted">(optional)</span></label><input id="sold-price" type="number" inputmode="decimal" step="0.01" min="0" max="100000000" placeholder="Unsold">
              <div class="save-row"><button type="submit">Save values</button><span id="value-dirty" class="caption" hidden>Unsaved changes</span></div>
            </form>
            <div class="profit"><span id="profit-label">Potential profit</span><strong id="profit"></strong></div>
          </section>
        </div>
      </section>
    </main>
  </div>
  <dialog id="vehicle-dialog" aria-labelledby="dialog-title">
    <form id="vehicle-form">
      <h2 id="dialog-title">Add vehicle</h2>
      <label for="form-name">Vehicle</label><input id="form-name" placeholder="2013 BMW 135i" maxlength="150" required>
      <label for="form-vin">VIN</label><input id="form-vin" minlength="17" maxlength="17" pattern="[A-HJ-NPR-Za-hj-npr-z0-9]{17}" autocomplete="off" spellcheck="false" required>
      <p id="form-error" role="alert"></p>
      <div class="dialog-actions"><button id="delete-vehicle" class="danger" type="button" hidden>Delete</button><span></span><button id="cancel-dialog" type="button">Cancel</button><button class="primary" type="submit">Save</button></div>
    </form>
  </dialog>
</body>
</html>
